[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "Job Pipeline Agent - Tracks application state, cadence nudges, recruiter vetting & follow-up drafting"
authors = [{ name = "Matt" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9.0",
    "httpx>=0.24.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "python-slugify>=8.0.0",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
